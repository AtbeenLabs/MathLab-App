name: Rescue and publish AtbinYar v1.12.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rescue-v1.12.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  rescue:
    name: Upload verified v1.12.0 artifacts and publish
    runs-on: ubuntu-latest
    steps:
      - name: Download the successful platform build artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 41046060145
          path: release-assets

      - name: Verify and publish v1.12.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.12.0"
          RELEASE_ID="428938889"

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          ACTUAL_TAG="$(jq -r '.tag_name' <<< "$RELEASE_JSON")"
          IS_DRAFT="$(jq -r '.draft' <<< "$RELEASE_JSON")"
          if [ "$ACTUAL_TAG" != "$TAG" ] || [ "$IS_DRAFT" != "true" ]; then
            echo "::error::The verified draft release does not match $TAG."
            exit 1
          fi

          mapfile -d '' -t ASSETS < <(find release-assets -type f -print0)
          if [ "${#ASSETS[@]}" -ne 8 ]; then
            echo "::error::Expected 8 platform assets, found ${#ASSETS[@]}."
            find release-assets -type f -print
            exit 1
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber

          ASSET_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")"
          for ASSET_PATH in "${ASSETS[@]}"; do
            ASSET_NAME="${ASSET_PATH##*/}"
            ASSET_NAME="${ASSET_NAME// /.}"
            if ! jq -e --arg name "$ASSET_NAME" '[.[] | select(.name == $name)] | length == 1' <<< "$ASSET_JSON" >/dev/null; then
              echo "::error::Missing release asset: $ASSET_NAME"
              exit 1
            fi
          done

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false >/dev/null
          echo "Published $TAG with 8 verified assets."
