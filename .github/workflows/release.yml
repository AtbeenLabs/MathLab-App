name: AtbinYar - Build and Release All Platforms

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "icon_*.png"
      - "logo.png"
      - "package.json"
      - "index.js"
      - "capacitor.config.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atbinyar-release-main
  cancel-in-progress: true

jobs:
  version:
    name: Version the source
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.bump.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump minor version and create tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          while git rev-parse -q --verify "refs/tags/v$NEW_VERSION" >/dev/null; do
            IFS='.' read -r MAJOR MINOR PATCH <<< "$NEW_VERSION"
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          done

          node - "$NEW_VERSION" <<'NODE'
          const fs = require('fs');
          const version = process.argv[2];
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}" "v$NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Linux
        run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.blockmap
            dist/latest-linux.yml
          if-no-files-found: error

  android:
    name: Signed Android APK and AAB
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Node dependencies
        run: npm install
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html manifest.json icon_192x192.png icon_512x512.png logo.png www/
      - name: Add Android platform
        run: npx cap add android
      - name: Configure signing and version
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/atbinyar-signing-key.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

          KEY_INFO="$(keytool -list -v -storetype PKCS12 -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")"
          printf '%s\n' "$KEY_INFO" | grep -q 'Entry type: PrivateKeyEntry'
          CERT_DIGEST="$(printf '%s\n' "$KEY_INFO" | awk -F': ' '/SHA256:/ {print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_DIGEST="7f9978ade037b7119d411b438f733a3770d1b88af1ac145f8abafbfa69f64b41"
          if [ "$CERT_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "::error::The uploaded P12 does not match the signing certificate of the current APK."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const [major, minor, patch] = process.env.APP_VERSION.split('.').map(Number);
          const versionCode = major * 10000 + minor * 100 + patch;
          const file = 'android/app/build.gradle';
          let gradleLines = fs.readFileSync(file, 'utf8').split(/\r?\n/);

          let codeIndex = -1;
          let nameIndex = -1;
          for (let i = 0; i < gradleLines.length; i++) {
            const trimmed = gradleLines[i].trim();
            if (trimmed.startsWith('versionCode ') || trimmed.startsWith('versionCode=')) codeIndex = i;
            if (trimmed.startsWith('versionName ') || trimmed.startsWith('versionName=')) nameIndex = i;
          }
          if (codeIndex < 0) throw new Error('versionCode line not found. Gradle app file format changed.');
          if (nameIndex < 0) throw new Error('versionName line not found. Gradle app file format changed.');

          const codeIndent = gradleLines[codeIndex].match(/^\s*/)[0];
          const nameIndent = gradleLines[nameIndex].match(/^\s*/)[0];
          gradleLines[codeIndex] = codeIndent + 'versionCode ' + versionCode;
          gradleLines[nameIndex] = nameIndent + 'versionName "' + process.env.APP_VERSION + '"';

          // Find the app android{} block's buildTypes/release blocks.
          const buildTypesIndex = gradleLines.findIndex(line => line.trim() === 'buildTypes {');
          if (buildTypesIndex < 0) throw new Error('buildTypes block not found in app Gradle file.');
          let releaseIndex = -1;
          for (let i = buildTypesIndex + 1; i < gradleLines.length; i++) {
            if (gradleLines[i].trim() === 'release {') { releaseIndex = i; break; }
          }
          if (releaseIndex < 0) throw new Error('release build type not found in app Gradle file.');

          // Place a dedicated signing config before buildTypes inside android{}.
          const signingStart = gradleLines.findIndex(line => line.trim() === 'signingConfigs {');
          if (signingStart < 0) {
            gradleLines.splice(buildTypesIndex, 0,
              '    signingConfigs {',
              '        atbinyarRelease {',
              '            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))',
              '            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")',
              '            keyAlias System.getenv("ANDROID_KEY_ALIAS")',
              '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")',
              '        }',
              '    }'
            );
          } else {
            // Add the dedicated entry inside the existing signingConfigs block.
            let depth = 0, closeIndex = -1;
            for (let i = signingStart; i < gradleLines.length; i++) {
              depth += (gradleLines[i].match(/{/g) || []).length;
              depth -= (gradleLines[i].match(/}/g) || []).length;
              if (i > signingStart && depth === 0) { closeIndex = i; break; }
            }
            if (closeIndex < 0) throw new Error('Unclosed signingConfigs block.');
            const already = gradleLines.slice(signingStart, closeIndex + 1).some(line => line.trim() === 'atbinyarRelease {');
            if (!already) gradleLines.splice(closeIndex, 0,
              '        atbinyarRelease {',
              '            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))',
              '            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")',
              '            keyAlias System.getenv("ANDROID_KEY_ALIAS")',
              '            keyPassword System.getenv("ANDROID_KEY_PASSWORD")',
              '        }'
            );
          }

          // Re-find buildTypes/release after any inserted lines, then set the signing config.
          const bt = gradleLines.findIndex(line => line.trim() === 'buildTypes {');
          let rel = -1;
          for (let i = bt + 1; i < gradleLines.length; i++) { if (gradleLines[i].trim() === 'release {') { rel = i; break; } }
          if (rel < 0) throw new Error('release build type disappeared during configuration.');
          let releaseClose = -1, depth = 0;
          for (let i = rel; i < gradleLines.length; i++) {
            depth += (gradleLines[i].match(/{/g) || []).length;
            depth -= (gradleLines[i].match(/}/g) || []).length;
            if (i > rel && depth === 0) { releaseClose = i; break; }
          }
          if (releaseClose < 0) throw new Error('Unclosed release build type.');
          const signingLine = '            signingConfig signingConfigs.atbinyarRelease';
          const oldSigning = gradleLines.findIndex((line, i) => i > rel && i < releaseClose && line.trim().startsWith('signingConfig '));
          if (oldSigning >= 0) gradleLines[oldSigning] = signingLine;
          else gradleLines.splice(releaseClose, 0, signingLine);

          fs.writeFileSync(file, gradleLines.join('\n'));
          console.log('Configured Android release ' + process.env.APP_VERSION + ' / versionCode ' + versionCode);
          NODE
      - name: Build APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path is not configured."
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in Android SDK build-tools."
            exit 1
          fi
          APK_INFO="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\\n' "$APK_INFO"
          CERT_DIGEST="$(printf '%s\\n' "$APK_INFO" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_DIGEST="7f9978ade037b7119d411b438f733a3770d1b88af1ac145f8abafbfa69f64b41"
          echo "Built APK certificate SHA-256: ${CERT_DIGEST:-MISSING}"
          echo "Expected certificate SHA-256: $EXPECTED_DIGEST"
          if [ "$CERT_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Built APK certificate does not match the current app's signing certificate."
            exit 1
          fi
          echo "APK signature matches the existing AtbinYar signing certificate."
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  release:
    name: Publish one combined release
    needs: [version, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" release-assets/**/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AtbinYar v$VERSION" \
            --notes "Automated release from MathLab-App main."
